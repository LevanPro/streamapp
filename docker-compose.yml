# Secure-by-default. Environment-specific values and ALL secrets come from a
# gitignored .env file (never committed). Defaults here are production-safe:
# - host ports bind to 127.0.0.1 only (override with WEB_BIND/DB_BIND for dev)
# - APP_DEBUG defaults off, APP_ENV defaults to production
# - DB passwords are REQUIRED (compose fails fast if MYSQL_* are unset)
# See .env.example for the variables to set per environment.
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./courses:/srv/courses:ro
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: ${APP_URL:-http://localhost:${WEB_PORT:-8081}}
      LOG_LEVEL: ${LOG_LEVEL:-warning}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-streamapp}
      DB_USERNAME: ${DB_USERNAME:-streamapp}
      DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      SESSION_DRIVER: database
      SESSION_SECURE_COOKIE: "${SESSION_SECURE_COOKIE:-true}"
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      COURSES_ROOT: /srv/courses
      COURSE_STREAM_DRIVER: ${COURSE_STREAM_DRIVER:-accel}
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8081}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./courses:/srv/courses:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "${DB_BIND:-127.0.0.1}:${DB_HOST_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-streamapp}
      MYSQL_USER: ${DB_USERNAME:-streamapp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot reproducible frontend build (pinned Node, no host Node required).
  # NOT started by `docker compose up` — only via the `build` profile:
  #   docker compose --profile build run --rm assets
  # Writes compiled assets into the bind-mounted ./public/build so php-fpm and
  # nginx serve them; this is the codified replacement for the ad-hoc
  # `docker run node ...` step in the git-pull deploy runbook.
  assets:
    image: node:22-bookworm-slim
    profiles: ["build"]
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm ci && npm run build"

volumes:
  db_data:

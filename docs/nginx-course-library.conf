server {
    listen 80;
    server_name courses.example.com;

    root /var/www/streamapp/public;
    index index.php;

    # Large files + efficient static file transfer
    client_max_body_size 100m;
    sendfile on;
    tcp_nopush on;
    aio threads;
    directio 8m;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Protect hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Laravel app
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 300;
    }

    # Protected internal media location.
    # Must match COURSE_INTERNAL_MEDIA_PREFIX in Laravel config/env.
    location /_protected_media/ {
        internal;
        alias /srv/courses/;
        try_files $uri =404;

        # Explicitly allow byte-range requests for seeking.
        add_header Accept-Ranges bytes always;

        # Private browser caching for files behind auth.
        add_header Cache-Control "private, max-age=86400" always;
        expires 1d;
    }
}
